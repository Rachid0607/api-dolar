<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cotação do Dólar</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <script src="app.js" defer></script>
</head>
<body class="bg-light">
  <main class="container py-5">
    <div class="mx-auto" style="max-width: 600px">
      <h1 class="h2 mb-2">Cotação do Dólar</h1>
      <p class="text-secondary mb-4">Dólar americano (USD) para real brasileiro (BRL)</p>

      <section class="card shadow-sm" aria-label="Cotação atual do dólar">
        <div class="card-body p-4">
          <p class="text-secondary mb-1">Valor atual</p>
          <p id="current-price" class="display-5 fw-semibold mb-4" aria-live="polite">Carregando...</p>
          <div class="row g-3">
            <div class="col-6">
              <p class="text-secondary mb-1">Maior valor do dia</p>
              <p id="day-high" class="h5 mb-0">—</p>
            </div>
            <div class="col-6">
              <p class="text-secondary mb-1">Menor valor do dia</p>
              <p id="day-low" class="h5 mb-0">—</p>
            </div>
          </div>
          <hr class="my-4">
          <div class="d-flex flex-wrap align-items-center justify-content-between gap-3">
            <p class="small text-secondary mb-0">Atualizado: <time id="updated-time">aguardando dados</time></p>
            <button id="refresh-button" class="btn btn-primary" type="button">Atualizar agora</button>
          </div>
        </div>
      </section>

      <p id="error-message" class="alert alert-danger mt-3" role="alert" hidden></p>
      <p class="small text-secondary mt-3 mb-0">Atualização automática a cada 10 segundos. Fonte: AwesomeAPI.</p>
    </div>
  </main>
</body>
</html>
